<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner — Gerencia</title>
<style>
/* Misma estética del dashboard principal (index.html) — autocontenido, sin CDNs */
:root {
  --bg:#0B0E13;--raised:#111519;--card:#161B22;--card-h:#1C222B;
  --bdr:#21272F;--bdr-h:#2D3540;
  --txt:#E6EAF0;--txt2:#8B95A8;--dim:#555F70;
  --red:#F04438;--red-s:rgba(240,68,56,.1);--red-b:rgba(240,68,56,.25);
  --org:#F79009;--org-s:rgba(247,144,9,.1);--org-b:rgba(247,144,9,.25);
  --ylw:#EAAA08;--ylw-s:rgba(234,170,8,.1);--ylw-b:rgba(234,170,8,.25);
  --blu:#528BFF;--blu-s:rgba(82,139,255,.1);--blu-b:rgba(82,139,255,.25);
  --grn:#12B76A;--grn-s:rgba(18,183,106,.1);--grn-b:rgba(18,183,106,.25);
  --pur:#9B8AFB;--pur-s:rgba(155,138,251,.12);--pur-b:rgba(155,138,251,.3);
  --acc:#818CF8;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:8px;--rl:12px;
  /* Colores por owner (spec): jose azul · rey verde · jonas ámbar · milagros violeta */
  --ow-jose:#528BFF;--ow-rey:#12B76A;--ow-jonas:#F79009;--ow-milagros:#9B8AFB;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans)}

/* Top bar */
.top{position:sticky;top:0;background:var(--raised);border-bottom:1px solid var(--bdr);padding:10px 16px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt)}
.logo{width:34px;height:34px;background:linear-gradient(135deg,var(--acc),var(--pur));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:1px;color:#fff;flex-shrink:0}
.brand-name{font-size:15px;font-weight:600;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--dim);white-space:nowrap}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.live{background:var(--grn-s);color:var(--grn);border:1px solid var(--grn-b)}
.pill.cache{background:var(--ylw-s);color:var(--ylw);border:1px solid var(--ylw-b)}
.pill.off{background:var(--red-s);color:var(--red);border:1px solid var(--red-b)}
.tbtn{background:var(--card);border:1px solid var(--bdr);color:var(--txt2);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--card-h);color:var(--txt);border-color:var(--bdr-h)}
.tbtn.primary{background:var(--blu);border-color:var(--blu);color:#fff;font-weight:600}
.tbtn.primary:hover{opacity:.85;background:var(--blu);color:#fff}
.backlink{font-size:12px;color:var(--txt2);text-decoration:none;padding:6px 4px;white-space:nowrap}
.backlink:hover{color:var(--txt)}

/* Toolbar: vistas + filtros */
.bar{position:sticky;top:55px;background:var(--raised);border-bottom:1px solid var(--bdr);padding:8px 16px;z-index:99;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.views{display:flex;gap:2px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:2px}
.views button{padding:6px 12px;font-size:13px;font-weight:500;color:var(--txt2);background:none;border:none;border-radius:6px;cursor:pointer;white-space:nowrap}
.views button:hover{color:var(--txt)}
.views button.on{background:var(--blu);color:#fff;font-weight:600}
.fsel{background:var(--card);border:1px solid var(--bdr);color:var(--txt);border-radius:6px;padding:6px 8px;font-size:12px;font-family:var(--sans);outline:none;max-width:180px}
.fsel:focus{border-color:var(--blu)}
.ochips{display:flex;gap:4px;flex-wrap:wrap}
.ochip{display:flex;align-items:center;gap:5px;padding:5px 10px;font-size:12px;font-weight:500;color:var(--txt2);background:var(--card);border:1px solid var(--bdr);border-radius:99px;cursor:pointer;white-space:nowrap}
.ochip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ochip.on{color:var(--txt);border-color:var(--bdr-h);background:var(--card-h);box-shadow:inset 0 0 0 1px var(--bdr-h)}
.spacer{flex:1}

/* Main */
.main{max-width:1500px;margin:0 auto;padding:14px 16px;width:100%}
.banner{background:var(--ylw-s);border:1px solid var(--ylw-b);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--txt)}
.banner b{color:var(--ylw)}
.banner.err{background:var(--red-s);border-color:var(--red-b)}
.banner.err b{color:var(--red)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 6px;text-align:center;position:relative;overflow:hidden}
.st::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.st.b::before{background:var(--blu)}.st.o::before{background:var(--org)}.st.g::before{background:var(--grn)}.st.r::before{background:var(--red)}
.st .n{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1}
.st.b .n{color:var(--blu)}.st.o .n{color:var(--org)}.st.g .n{color:var(--grn)}.st.r .n{color:var(--red)}
.st .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-top:4px}

/* Calendario */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.caltitle{font-size:18px;font-weight:700;text-transform:capitalize;min-width:180px}
.calnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--bdr);border-radius:6px;padding:2px}
.calnav button{width:28px;height:28px;border:none;background:none;color:var(--txt2);font-size:16px;cursor:pointer;border-radius:4px}
.calnav button:hover{background:var(--card-h);color:var(--txt)}
.calnav .hoy{width:auto;padding:0 10px;font-size:12px;font-weight:600}
.calmode{display:flex;gap:2px;background:var(--card);border:1px solid var(--bdr);border-radius:6px;padding:2px}
.calmode button{padding:4px 10px;font-size:12px;border:none;background:none;color:var(--txt2);border-radius:4px;cursor:pointer}
.calmode button.on{background:var(--blu);color:#fff;font-weight:600}
.cal-scroll{overflow-x:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:700px}
.dow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);text-align:center;padding:2px 0}
.day{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);min-height:92px;padding:4px;position:relative;display:flex;flex-direction:column;gap:3px}
.day.wk{min-height:340px}
.day.other{opacity:.45}
.day.today{border-color:var(--blu);box-shadow:inset 0 0 0 1px var(--blu)}
.day.past{background:#12161C}
.dnum{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--txt2);display:flex;justify-content:space-between;align-items:center}
.day.today .dnum{color:var(--blu)}
.dadd{opacity:0;border:none;background:none;color:var(--dim);font-size:13px;cursor:pointer;line-height:1;padding:0 2px;border-radius:3px}
.day:hover .dadd{opacity:1}
.dadd:hover{color:var(--txt);background:var(--card-h)}
.ch{font-size:11px;line-height:1.25;padding:3px 5px 3px 7px;border-radius:5px;background:var(--card-h);border:1px solid var(--bdr);border-left:3px solid var(--dim);cursor:pointer;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ch:hover{border-color:var(--bdr-h);border-left-width:3px;background:#222933}
.ch.oj{border-left-color:var(--ow-jose)}.ch.or{border-left-color:var(--ow-rey)}.ch.oo{border-left-color:var(--ow-jonas)}.ch.om{border-left-color:var(--ow-milagros)}
.ch.hito{font-weight:700;background:var(--pur-s);border-color:var(--pur-b)}
.ch.late{border-color:var(--red-b);background:var(--red-s)}
.ch.cont{opacity:.55;-webkit-line-clamp:1}
.ch.done{opacity:.5;text-decoration:line-through}
.ch .chp{color:var(--dim);font-size:10px}
.more{font-size:10px;color:var(--blu);cursor:pointer;padding:1px 4px;font-weight:600}
.more:hover{text-decoration:underline}
.tray{margin-top:12px;background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 12px}
.tray-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-bottom:8px}
.tray-items{display:flex;flex-wrap:wrap;gap:6px}
.tray .ch{display:inline-block;-webkit-line-clamp:unset;max-width:340px;white-space:nowrap;text-overflow:ellipsis}

/* Por persona */
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.pcol{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column}
.pcol-h{padding:10px 12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;background:var(--raised)}
.pcol-h .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pcol-h .nm{font-size:14px;font-weight:700;text-transform:capitalize;flex:1}
.pcol-h .cnt{font-family:var(--mono);font-size:11px;color:var(--txt2)}
.pcol-h .esperabdg{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--red);background:var(--red-s);border:1px solid var(--red-b);padding:1px 6px;border-radius:99px;cursor:pointer}
.pcol-b{padding:8px 10px;display:flex;flex-direction:column;gap:10px;flex:1}
.sect-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:4px}
.sect-t.late{color:var(--red)}
.it{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;background:var(--raised);border:1px solid var(--bdr);border-radius:6px;margin-bottom:4px;cursor:pointer;border-left:3px solid var(--dim)}
.it:hover{border-color:var(--bdr-h);background:var(--card-h)}
.it.oj{border-left-color:var(--ow-jose)}.it.or{border-left-color:var(--ow-rey)}.it.oo{border-left-color:var(--ow-jonas)}.it.om{border-left-color:var(--ow-milagros)}
.it.late{background:var(--red-s);border-color:var(--red-b)}
.it .ic{font-size:11px;line-height:1.5;flex-shrink:0}
.it .tt{font-size:12px;line-height:1.35;flex:1;min-width:0}
.it .tt .meta{display:block;font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:1px}
.it .tt .meta .lt{color:var(--red);font-weight:700}
.it.doneit .tt{text-decoration:line-through;opacity:.6}
.okbtn{border:1px solid var(--grn-b);background:var(--grn-s);color:var(--grn);font-size:11px;font-weight:700;border-radius:5px;cursor:pointer;padding:2px 7px;flex-shrink:0;line-height:1.5}
.okbtn:hover{background:var(--grn);color:#fff}
.doingtag{font-size:9px;font-weight:700;color:var(--ylw);background:var(--ylw-s);border:1px solid var(--ylw-b);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.srctag{font-size:9px;color:var(--dim);border:1px solid var(--bdr);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}

/* El equipo espera de ti */
.espera{background:var(--red-s);border:1px solid var(--red-b);border-radius:var(--rl);padding:12px 14px}
.espera-t{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--red);margin-bottom:10px}
.espera-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.esp-col .nm{font-size:12px;font-weight:700;text-transform:capitalize;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.esp-col .nm .dot{width:8px;height:8px;border-radius:50%}
.esp-it{font-size:11.5px;line-height:1.4;padding:6px 8px;background:rgba(0,0,0,.25);border:1px solid var(--red-b);border-radius:6px;margin-bottom:4px}
.esp-it .who{color:var(--txt2);font-size:10px;display:block}
.esp-it.crit{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red-b)}
.esp-it .critb{color:var(--red);font-weight:700}
.esp-empty{font-size:11px;color:var(--dim);font-style:italic}

/* Por proyecto / iniciativa */
.gsec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--txt2);margin:16px 0 8px}
.gsec-t:first-child{margin-top:0}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.gcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rl);padding:12px}
.gcard .gt{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.gcard .gt .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.gcard .gd{font-size:11.5px;color:var(--txt2);margin:3px 0 8px;line-height:1.4}
.prog{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prog .bar{flex:1;height:6px;background:var(--raised);border-radius:99px;overflow:hidden}
.prog .fill{height:100%;background:var(--grn);border-radius:99px}
.prog .pn{font-family:var(--mono);font-size:11px;color:var(--txt2);white-space:nowrap}
.gempty{font-size:11px;color:var(--dim);font-style:italic;padding:4px 0}

/* Modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px;min-width:300px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.mtitle{font-size:16px;font-weight:700;line-height:1.3}
.mx{background:none;border:none;color:var(--txt2);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.mx:hover{color:var(--txt)}
.mlab{font-size:11px;color:var(--txt2);font-weight:600;margin:8px 0 3px;display:block}
.minp,.msel,.mtxa{width:100%;background:var(--bg);border:1px solid var(--bdr);color:var(--txt);padding:8px 10px;font-size:13px;border-radius:6px;font-family:var(--sans);outline:none}
.minp:focus,.msel:focus,.mtxa:focus{border-color:var(--blu)}
.mtxa{resize:vertical;min-height:56px}
.mrow{display:flex;gap:10px}
.mrow>div{flex:1}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.merr{color:var(--red);font-size:12px;margin-top:8px;display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:8px 0}
.kv .k{color:var(--dim);font-weight:600}
.kv .v{color:var(--txt)}

/* Gate */
.pw-gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center}
.pw-gate .pw-icon{font-size:48px;margin-bottom:16px;opacity:.4}
.pw-gate .pw-title{font-size:20px;font-weight:600;color:var(--txt);margin-bottom:4px}
.pw-gate .pw-sub{font-size:13px;color:var(--dim);margin-bottom:20px}
.pw-gate input{background:var(--card);border:1px solid var(--bdr);border-radius:6px;padding:10px 14px;font-size:14px;font-family:var(--sans);color:var(--txt);width:260px;text-align:center;outline:none}
.pw-gate input:focus{border-color:var(--blu)}
.pw-gate input.pw-err{border-color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pw-gate .pw-btn{margin-top:10px;padding:8px 28px;font-size:14px;font-weight:600;background:var(--blu);color:#fff;border:none;border-radius:6px;cursor:pointer}
.pw-gate .pw-deny{color:var(--red);font-size:13px;margin-top:10px;font-weight:500;display:none}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center}
.empty-i{font-size:40px;margin-bottom:12px;opacity:.3}
.empty-t{font-size:18px;font-weight:600;color:var(--txt2);margin-bottom:6px}
.empty-d{font-size:13px;color:var(--dim);max-width:420px}

/* Responsive */
@media(max-width:1100px){
  .people{grid-template-columns:repeat(2,1fr)}
  .espera-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .main{padding:10px 8px}
  .people{grid-template-columns:1fr}
  .espera-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .caltitle{font-size:15px;min-width:0}
  .brand-sub{display:none}
  .dadd{opacity:1}
  .gcards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="index.html">
    <div class="logo">AG</div>
    <div>
      <div class="brand-name">🗓 Planner de Gerencia</div>
      <div class="brand-sub">jose · rey · jonas · milagros — qué tiene cada quién y cuándo</div>
    </div>
  </a>
  <div class="top-right" id="top-right" style="display:none">
    <span class="pill off" id="statuspill">…</span>
    <button class="tbtn primary" id="btn-new" title="Crear ítem rápido">＋ Nuevo</button>
    <button class="tbtn" id="btn-refresh" title="Recargar">↻</button>
    <button class="tbtn" id="btn-cfg" title="Configurar API (túnel + token)">⚙</button>
    <a class="backlink" href="index.html">‹ Dashboard</a>
  </div>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="views" id="views">
    <button data-v="cal">🗓 Calendario</button>
    <button data-v="per">👤 Por persona</button>
    <button data-v="proj">📦 Proyectos</button>
  </div>
  <div class="ochips" id="ochips"></div>
  <select class="fsel" id="f-project" title="Filtrar por proyecto/iniciativa"></select>
  <select class="fsel" id="f-status" title="Filtrar por estado">
    <option value="activos">Activos (open+doing)</option>
    <option value="open">Abiertos</option>
    <option value="doing">En curso</option>
    <option value="vencido">Vencidos</option>
    <option value="done">Hechos (últimos 7d)</option>
  </select>
</div>

<div class="main" id="content"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   PLANNER DE GERENCIA — SPEC_PLANNER_GERENCIA.md §3 (Jose 2026-08-10)
   Lee GET /planner/state del finance_api (mismo túnel+token del tab
   Finance); acciones: PATCH done / POST ítem rápido. Si la API no
   responde → modo LECTURA con el último estado cacheado (localStorage).
   SIN HOSTIGAR: cero polling; se recarga al entrar o con ↻.
   ════════════════════════════════════════════════════════════════════ */

const MGMT_PW = 'Awesome';   // mismo gate de gerencia que el tab Management (sessionStorage compartido)
const OWNERS = ['jose', 'rey', 'jonas', 'milagros'];
const OW_COLOR = { jose:'var(--ow-jose)', rey:'var(--ow-rey)', jonas:'var(--ow-jonas)', milagros:'var(--ow-milagros)' };
const OW_CLS = { jose:'oj', rey:'or', jonas:'oo', milagros:'om' };
const KIND_ICON = { hito:'◆', tarea:'▸', todo:'•' };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOWS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const CACHE_KEY = 'planner_cache_v1';
const FILTER_KEY = 'planner_filters_v1';

let STATE = null;          // /planner/state (vivo o cacheado)
let LIVE = false;          // true = API respondió ahora mismo
let CACHE_TS = null;       // cuándo se cacheó lo que se está mostrando
let LOAD_ERR = null;
let VIEW = localStorage.getItem('planner_view') || 'cal';
let CAL_MODE = localStorage.getItem('planner_calmode') || 'month';
let CAL_ANCHOR = null;     // Date del mes/semana visible
let FILTERS = { owner:'all', project:'all', status:'activos' };
try { FILTERS = { ...FILTERS, ...(JSON.parse(localStorage.getItem(FILTER_KEY)||'{}')) }; } catch(e) {}

/* ── API (mismo patrón/llaves que el tab Finance del dashboard) ────── */
window._publishedApiUrl = null;
async function discoverApiUrl(){
  try {
    const r = await fetch('data/api-url.json?_='+Date.now(), {cache:'no-store'});
    if (r.ok) {
      const j = await r.json();
      if (j && j.url) {
        window._publishedApiUrl = String(j.url).replace(/\/+$/, '');
        const stored = (localStorage.getItem('finance_api_url')||'').replace(/\/+$/, '');
        if (stored && stored !== window._publishedApiUrl)
          localStorage.setItem('finance_api_url', window._publishedApiUrl);  // auto-heal URL vieja
      }
    }
  } catch(e) {}
}
function apiConfig(){
  return {
    url: (localStorage.getItem('finance_api_url')||window._publishedApiUrl||'').replace(/\/+$/, ''),
    token: localStorage.getItem('finance_api_token')||'',
  };
}
function apiConfigured(){ const {url,token}=apiConfig(); return !!(url&&token); }
async function api(path, options={}){
  const {url, token} = apiConfig();
  if (!url || !token) throw new Error('API no configurada (abre ⚙)');
  const res = await fetch(url+path, { ...options,
    headers: { 'Authorization':'Bearer '+token, 'Content-Type':'application/json', ...(options.headers||{}) } });
  const text = await res.text();
  let body; try { body = text ? JSON.parse(text) : null; } catch(e){ body = text; }
  if (!res.ok) throw new Error('API '+res.status+': '+(typeof body==='string'?body:JSON.stringify(body)));
  return body;
}

/* ── helpers ───────────────────────────────────────────────────────── */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function mondayOf(d){ const x=new Date(d); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function todayIso(){ return (STATE && STATE.today) || iso(new Date()); }
function fmtDia(s){ if(!s) return ''; const d=fromIso(s); return d.getDate()+' '+MESES[d.getMonth()].slice(0,3); }
function fmtTs(s){ if(!s) return ''; const d=new Date(s); return isNaN(d)?String(s):d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function saveFilters(){ localStorage.setItem(FILTER_KEY, JSON.stringify(FILTERS)); }

/* ── datos: normalización + filtros ────────────────────────────────── */
function allActive(){
  const out=[]; const ipo=(STATE&&STATE.items_por_owner)||{};
  for (const o of Object.keys(ipo)) for (const it of ipo[o]||[]) out.push(it);
  return out;
}
function normFlags(it){
  const t=todayIso(); const wk=(STATE&&STATE.week)||{};
  it.vencido = !!(it.due && it.due < t && (it.status==='open'||it.status==='doing'));
  it.esta_semana = !!(it.due && wk.monday && it.due>=wk.monday && it.due<=wk.sunday);
  return it;
}
function pool(){
  // según filtro de estado: activos (state) o hechos recientes
  let items;
  if (FILTERS.status==='done') items = ((STATE&&STATE.done_recientes)||[]).map(normFlags);
  else {
    items = allActive().map(normFlags);
    if (FILTERS.status==='open')   items = items.filter(i=>i.status==='open');
    if (FILTERS.status==='doing')  items = items.filter(i=>i.status==='doing');
    if (FILTERS.status==='vencido')items = items.filter(i=>i.vencido);
  }
  if (FILTERS.owner!=='all') items = items.filter(i=>i.owner===FILTERS.owner);
  if (FILTERS.project!=='all'){
    if (FILTERS.project==='__none') items = items.filter(i=>!i.project&&!i.parent_id);
    else if (FILTERS.project.startsWith('ini:')) { const id=+FILTERS.project.slice(4); items=items.filter(i=>i.parent_id===id); }
    else items = items.filter(i=>i.project===FILTERS.project);
  }
  return items;
}
function iniMap(){ const m={}; for(const i of (STATE&&STATE.iniciativas)||[]) m[i.id]=i; return m; }
function findItem(id){
  for (const it of allActive()) if (it.id===id) return it;
  for (const it of (STATE&&STATE.done_recientes)||[]) if (it.id===id) return it;
  for (const ini of (STATE&&STATE.iniciativas)||[]) for (const it of ini.items||[]) if (it.id===id) return it;
  return null;
}

/* ── carga: LIVE → cache → aviso ──────────────────────────────────── */
async function refresh(silent){
  const c = document.getElementById('content');
  if (!silent) c.innerHTML = '<div class="empty"><div class="empty-i">⏳</div><div class="empty-t">Cargando planner…</div></div>';
  LOAD_ERR = null; LIVE = false;
  if (apiConfigured()){
    try {
      const st = await api('/planner/state');
      STATE = st; LIVE = true; CACHE_TS = new Date().toISOString();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ts:CACHE_TS, data:st})); } catch(e) {}
    } catch(e){ LOAD_ERR = e.message||String(e); }
  } else LOAD_ERR = 'API no configurada';
  if (!LIVE){
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if (cached && cached.data){ STATE = cached.data; CACHE_TS = cached.ts; }
    } catch(e) {}
  }
  render();
}

/* ── render raíz ───────────────────────────────────────────────────── */
function render(){
  document.getElementById('top-right').style.display='';
  document.getElementById('bar').style.display='';
  renderStatusPill(); renderViews(); renderOwnerChips(); renderProjectSel();
  document.getElementById('f-status').value = FILTERS.status;
  const c = document.getElementById('content');
  if (!STATE){
    c.innerHTML = '<div class="empty"><div class="empty-i">🗓</div><div class="empty-t">Sin datos del planner</div>'+
      '<div class="empty-d">'+(LOAD_ERR?('La API no responde ('+esc(LOAD_ERR)+') y no hay estado cacheado en este navegador. '):'')+
      'Abre ⚙ y configura la URL del túnel + el Bearer token (los mismos del tab Finance).</div></div>';
    return;
  }
  let html = '';
  if (!LIVE){
    html += '<div class="banner err"><b>MODO LECTURA</b> — la API no responde'+(LOAD_ERR?(' ('+esc(LOAD_ERR)+')'):'')+
      '. Mostrando el último estado cacheado'+(CACHE_TS?(' del <b>'+esc(fmtTs(CACHE_TS))+'</b>'):'')+
      '. Las acciones (done / crear) están desactivadas. <button class="tbtn" style="margin-left:6px" onclick="refresh()">Reintentar</button></div>';
  }
  html += renderStats();
  if (VIEW==='cal') html += renderCal();
  else if (VIEW==='per') html += renderPer();
  else html += renderProj();
  c.innerHTML = html;
  wireContent();
}
function renderStatusPill(){
  const p = document.getElementById('statuspill');
  if (LIVE){ p.className='pill live'; p.textContent='● LIVE'; p.title='API viva — '+fmtTs(STATE&&STATE.generated_ts); }
  else if (STATE){ p.className='pill cache'; p.textContent='◌ CACHE'; p.title='Último estado: '+fmtTs(CACHE_TS); }
  else { p.className='pill off'; p.textContent='sin datos'; p.title=LOAD_ERR||''; }
  document.getElementById('btn-new').style.display = LIVE ? '' : 'none';
}
function renderViews(){
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on', b.dataset.v===VIEW));
}
function renderOwnerChips(){
  const box = document.getElementById('ochips');
  let h = '<div class="ochip'+(FILTERS.owner==='all'?' on':'')+'" data-o="all">Todos</div>';
  for (const o of OWNERS)
    h += '<div class="ochip'+(FILTERS.owner===o?' on':'')+'" data-o="'+o+'"><span class="dot" style="background:'+OW_COLOR[o]+'"></span>'+o+'</div>';
  box.innerHTML = h;
  box.querySelectorAll('.ochip').forEach(ch=>ch.onclick=()=>{ FILTERS.owner=ch.dataset.o; saveFilters(); render(); });
}
function renderProjectSel(){
  const sel = document.getElementById('f-project');
  const projs = new Set();
  for (const it of allActive()) if (it.project) projs.add(it.project);
  for (const it of (STATE&&STATE.done_recientes)||[]) if (it.project) projs.add(it.project);
  let h = '<option value="all">Todos los proyectos</option>';
  for (const ini of (STATE&&STATE.iniciativas)||[]) h += '<option value="ini:'+ini.id+'">🎯 '+esc(ini.title)+'</option>';
  for (const p of [...projs].sort()) h += '<option value="'+esc(p)+'">'+esc(p)+'</option>';
  h += '<option value="__none">Sin proyecto/iniciativa</option>';
  sel.innerHTML = h;
  sel.value = FILTERS.project;
  if (sel.value!==FILTERS.project){ FILTERS.project='all'; sel.value='all'; saveFilters(); }
}
function renderStats(){
  const cts = (STATE&&STATE.counts)||{};
  return '<div class="stats">'+
    '<div class="st b"><div class="n">'+(cts.abiertos??'—')+'</div><div class="l">Activos</div></div>'+
    '<div class="st o"><div class="n">'+(cts.hitos??'—')+'</div><div class="l">◆ Hitos próximos</div></div>'+
    '<div class="st g"><div class="n">'+(cts.done_7d??'—')+'</div><div class="l">Hechos 7d</div></div>'+
    '<div class="st r"><div class="n">'+(cts.equipo_espera??'—')+'</div><div class="l">El equipo espera</div></div>'+
  '</div>';
}

/* ── VISTA 1: CALENDARIO ───────────────────────────────────────────── */
function ensureAnchor(){ if (!CAL_ANCHOR) CAL_ANCHOR = fromIso(todayIso()); }
function itemsForDay(dayIso, items){
  const out=[];
  for (const it of items){
    if (it.due){ if (it.due===dayIso) out.push({it, cont:false}); }
    else if (it.start && it.end){ if (it.start<=dayIso && dayIso<=it.end) out.push({it, cont: dayIso!==it.start}); }
    else if (it.start){ if (it.start===dayIso) out.push({it, cont:false}); }
  }
  out.sort((a,b)=> (a.it.kind==='hito'?-1:0)-(b.it.kind==='hito'?-1:0) || a.it.owner.localeCompare(b.it.owner));
  return out;
}
function chipHtml(e, extra){
  const it=e.it;
  const cls = ['ch', OW_CLS[it.owner]||'', it.kind==='hito'?'hito':'', it.vencido?'late':'', e.cont?'cont':'', it.status==='done'?'done':''].filter(Boolean).join(' ');
  const pref = it.kind==='hito' ? '◆ ' : '';
  const doing = it.status==='doing' ? ' <span class="chp">▶</span>' : '';
  return '<div class="'+cls+'" data-id="'+it.id+'" title="'+esc(it.title)+' — '+it.owner+'">'+pref+esc(it.title)+doing+(extra||'')+'</div>';
}
function renderCal(){
  ensureAnchor();
  const items = pool();
  const t = todayIso();
  let title, first, last;
  if (CAL_MODE==='month'){
    const y=CAL_ANCHOR.getFullYear(), m=CAL_ANCHOR.getMonth();
    title = MESES[m]+' '+y;
    first = mondayOf(new Date(y,m,1));
    const lastOfMonth = new Date(y,m+1,0);
    last = addDays(mondayOf(lastOfMonth),6);
  } else {
    first = mondayOf(CAL_ANCHOR); last = addDays(first,6);
    title = 'Semana '+first.getDate()+' '+MESES[first.getMonth()].slice(0,3)+' – '+last.getDate()+' '+MESES[last.getMonth()].slice(0,3);
  }
  let h = '<div class="calhead">'+
    '<div class="calnav"><button id="cal-prev">‹</button><button class="hoy" id="cal-hoy">Hoy</button><button id="cal-next">›</button></div>'+
    '<div class="caltitle">'+esc(title)+'</div>'+
    '<div class="spacer"></div>'+
    '<div class="calmode"><button data-m="month"'+(CAL_MODE==='month'?' class="on"':'')+'>Mes</button><button data-m="week"'+(CAL_MODE==='week'?' class="on"':'')+'>Semana</button></div>'+
  '</div>';
  h += '<div class="cal-scroll"><div class="calgrid">';
  for (const d of DOWS) h += '<div class="dow">'+d+'</div>';
  const maxChips = CAL_MODE==='month' ? 4 : 99;
  const curMonth = CAL_ANCHOR.getMonth();
  for (let d=new Date(first); d<=last; d=addDays(d,1)){
    const dIso = iso(d);
    const dayItems = itemsForDay(dIso, items);
    const cls = ['day', CAL_MODE==='week'?'wk':'',
      (CAL_MODE==='month' && d.getMonth()!==curMonth)?'other':'',
      dIso===t?'today':'', dIso<t?'past':''].filter(Boolean).join(' ');
    h += '<div class="'+cls+'"><div class="dnum"><span>'+d.getDate()+'</span>'+
      (LIVE?'<button class="dadd" data-due="'+dIso+'" title="Crear ítem este día">＋</button>':'')+'</div>';
    dayItems.slice(0,maxChips).forEach(e=>{ h += chipHtml(e); });
    if (dayItems.length>maxChips) h += '<div class="more" data-day="'+dIso+'">+'+(dayItems.length-maxChips)+' más</div>';
    h += '</div>';
  }
  h += '</div></div>';
  const sinFecha = items.filter(i=>!i.due&&!i.start);
  if (sinFecha.length){
    h += '<div class="tray"><div class="tray-t">Sin fecha ('+sinFecha.length+') — asígnales un due desde el detalle</div><div class="tray-items">';
    for (const it of sinFecha) h += chipHtml({it,cont:false});
    h += '</div></div>';
  }
  return h;
}

/* ── VISTA 2: POR PERSONA ──────────────────────────────────────────── */
function bucketOf(it){
  const t=todayIso(); const wk=(STATE&&STATE.week)||{};
  if (FILTERS.status==='done') return 'done';
  if (it.vencido) return 'vencido';
  if (it.due===t) return 'hoy';
  if (it.due && wk.sunday && it.due<=wk.sunday) return 'semana';
  return 'despues';
}
function itemRow(it){
  const ini = it.parent_id ? iniMap()[it.parent_id] : null;
  const meta = [];
  if (it.due) meta.push(it.vencido?'<span class="lt">'+fmtDia(it.due)+' ⚠</span>':fmtDia(it.due));
  if (it.project) meta.push(esc(it.project));
  if (ini) meta.push('🎯 '+esc(ini.title));
  const tags = (it.status==='doing'?'<span class="doingtag">EN CURSO</span>':'') +
               (it.source&&it.source!=='manual'?'<span class="srctag">'+esc(it.source)+'</span>':'');
  const cls = ['it', OW_CLS[it.owner]||'', it.vencido?'late':'', it.status==='done'?'doneit':''].filter(Boolean).join(' ');
  return '<div class="'+cls+'" data-id="'+it.id+'">'+
    '<span class="ic">'+(KIND_ICON[it.kind]||'•')+'</span>'+
    '<span class="tt">'+esc(it.title)+tags+(meta.length?'<span class="meta">'+meta.join(' · ')+'</span>':'')+'</span>'+
    (LIVE && it.status!=='done' ? '<button class="okbtn" data-done="'+it.id+'" title="Marcar hecho">✓</button>' : '')+
  '</div>';
}
function renderPer(){
  const items = pool();
  const espera = (STATE&&STATE.equipo_espera)||{};
  const owners = FILTERS.owner==='all' ? OWNERS : [FILTERS.owner];
  let h = '<div class="people" style="grid-template-columns:repeat('+(owners.length>2?4:owners.length)+',1fr)">';
  if (owners.length===1) h = '<div class="people" style="grid-template-columns:1fr">';
  for (const o of owners){
    const mine = items.filter(i=>i.owner===o);
    const buckets = {vencido:[],hoy:[],semana:[],despues:[],done:[]};
    for (const it of mine) buckets[bucketOf(it)].push(it);
    const nEsp = (espera[o]||[]).length;
    h += '<div class="pcol"><div class="pcol-h">'+
      '<span class="dot" style="background:'+OW_COLOR[o]+'"></span><span class="nm">'+o+'</span>'+
      (nEsp?'<span class="esperabdg" data-esp="'+o+'" title="El equipo espera de '+o+'">'+nEsp+' ⏳</span>':'')+
      '<span class="cnt">'+mine.length+'</span></div><div class="pcol-b">';
    const secs = FILTERS.status==='done'
      ? [['done','Hechos (7d)','']]
      : [['vencido','Vencido','late'],['hoy','Hoy',''],['semana','Esta semana',''],['despues','Después / sin fecha','']];
    let any=false;
    for (const [k,label,cl] of secs){
      if (!buckets[k].length) continue; any=true;
      h += '<div><div class="sect-t '+cl+'">'+label+' · '+buckets[k].length+'</div>';
      for (const it of buckets[k]) h += itemRow(it);
      h += '</div>';
    }
    if (!any) h += '<div class="gempty">Nada pendiente con este filtro ✨</div>';
    h += '</div></div>';
  }
  h += '</div>';
  h += renderEspera(owners, espera);
  return h;
}
function renderEspera(owners, espera){
  let h = '<div class="espera" id="espera"><div class="espera-t">⏳ EL EQUIPO ESPERA DE TI — solicitudes abiertas del equipo (ops.db)</div>';
  h += '<div class="espera-grid" style="grid-template-columns:repeat('+(owners.length>2?4:owners.length)+',1fr)">';
  for (const o of owners){
    const rows = espera[o]||[];
    h += '<div class="esp-col"><div class="nm"><span class="dot" style="background:'+OW_COLOR[o]+'"></span>'+o+' · '+rows.length+'</div>';
    if (!rows.length) h += '<div class="esp-empty">nadie espera nada ✔</div>';
    for (const r of rows.slice(0,12)){
      h += '<div class="esp-it'+(r.critico?' crit':'')+'">'+(r.critico?'<span class="critb">⚠ CRÍTICO · </span>':'')+esc(r.what)+
        '<span class="who">pide <b>'+esc(r.waiter||'?')+'</b>'+(r.project?' · '+esc(r.project):'')+(r.ts?' · '+esc(String(r.ts).slice(0,10)):'')+'</span></div>';
    }
    if (rows.length>12) h += '<div class="esp-empty">+'+(rows.length-12)+' más…</div>';
    h += '</div>';
  }
  h += '</div>';
  if (espera._error) h += '<div class="esp-empty" style="margin-top:6px">ops.db: '+esc(espera._error)+'</div>';
  h += '</div>';
  return h;
}

/* ── VISTA 3: POR PROYECTO / INICIATIVA ────────────────────────────── */
function renderProj(){
  const items = pool();
  const inis = (STATE&&STATE.iniciativas)||[];
  let h = '<div class="gsec-t">🎯 Iniciativas (los ítems más grandes)</div>';
  if (!inis.length) h += '<div class="gempty">No hay iniciativas abiertas.</div>';
  h += '<div class="gcards">';
  for (const ini of inis){
    const pct = ini.total_count ? Math.round(100*ini.done_count/ini.total_count) : 0;
    let kids = (ini.items||[]).map(normFlags);
    if (FILTERS.owner!=='all') kids = kids.filter(i=>i.owner===FILTERS.owner);
    if (FILTERS.status==='open') kids = kids.filter(i=>i.status==='open');
    if (FILTERS.status==='doing') kids = kids.filter(i=>i.status==='doing');
    if (FILTERS.status==='vencido') kids = kids.filter(i=>i.vencido);
    h += '<div class="gcard"><div class="gt">'+
      (ini.owner?'<span class="dot" style="background:'+(OW_COLOR[ini.owner]||'var(--dim)')+'" title="'+esc(ini.owner)+'"></span>':'<span class="dot" style="background:var(--dim)" title="compartida"></span>')+
      esc(ini.title)+'</div>'+
      (ini.detail?'<div class="gd">'+esc(ini.detail)+'</div>':'')+
      '<div class="prog"><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '<span class="pn">'+ini.done_count+' / '+ini.total_count+' done'+(ini.due?' · ⌛ '+fmtDia(ini.due):'')+'</span></div>';
    if (kids.length) for (const it of kids) h += itemRow(it);
    else h += '<div class="gempty">sin ítems activos'+(FILTERS.owner!=='all'||FILTERS.status!=='activos'?' con este filtro':'')+'</div>';
    h += '</div>';
  }
  h += '</div>';
  // por proyecto (slug de _registry) — ítems activos sin iniciativa
  const loose = items.filter(i=>!i.parent_id);
  const byProj = {};
  for (const it of loose){ const k = it.project||'__none'; (byProj[k]=byProj[k]||[]).push(it); }
  const keys = Object.keys(byProj).sort((a,b)=> (a==='__none')-(b==='__none') || a.localeCompare(b));
  h += '<div class="gsec-t">🏗 Por proyecto</div>';
  if (!keys.length) h += '<div class="gempty">Nada con este filtro.</div>';
  h += '<div class="gcards">';
  for (const k of keys){
    const rows = byProj[k];
    h += '<div class="gcard"><div class="gt">'+(k==='__none'?'— Sin proyecto':esc(k))+
      ' <span class="pn" style="font-family:var(--mono);font-size:11px;color:var(--txt2)">'+rows.length+' activos</span></div>';
    for (const it of rows) h += itemRow(it);
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* ── modales ───────────────────────────────────────────────────────── */
function modal(titleHtml, bodyHtml){
  const bg = document.createElement('div');
  bg.className='mbg';
  bg.innerHTML = '<div class="mbox"><div class="mhead"><div class="mtitle">'+titleHtml+'</div>'+
    '<button class="mx" data-close>×</button></div>'+bodyHtml+'<div class="merr" data-err></div></div>';
  document.body.appendChild(bg);
  const close = ()=>bg.remove();
  bg.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', close));
  bg.addEventListener('click', e=>{ if (e.target===bg) close(); });
  bg.showErr = (m)=>{ const e=bg.querySelector('[data-err]'); e.textContent=m; e.style.display='block'; };
  bg.close = close;
  return bg;
}
function openDetail(id){
  const it = findItem(id);
  if (!it) return;
  const ini = it.parent_id ? iniMap()[it.parent_id] : null;
  const kv = [
    ['Owner', '<span style="color:'+(OW_COLOR[it.owner]||'inherit')+';font-weight:700">'+esc(it.owner)+'</span>'],
    ['Tipo', (KIND_ICON[it.kind]||'•')+' '+esc(it.kind)],
    ['Estado', esc(it.status)+(it.vencido?' · <b style="color:var(--red)">VENCIDO</b>':'')],
    it.project?['Proyecto', esc(it.project)]:null,
    ini?['Iniciativa','🎯 '+esc(ini.title)]:null,
    it.due?['Fecha (due)', esc(it.due)+' ('+fmtDia(it.due)+')']:null,
    (it.start||it.end)?['Rango', esc(it.start||'?')+' → '+esc(it.end||'?')]:null,
    ['Fuente', esc(it.source||'manual')],
    ['Creado', esc(String(it.created_ts||'').slice(0,16).replace('T',' '))],
    it.done_ts?['Cerrado', esc(String(it.done_ts).slice(0,16).replace('T',' '))]:null,
  ].filter(Boolean);
  let body = '<div class="kv">'+kv.map(([k,v])=>'<div class="k">'+k+'</div><div class="v">'+v+'</div>').join('')+'</div>';
  if (it.detail) body += '<div style="font-size:12.5px;color:var(--txt2);background:var(--raised);border:1px solid var(--bdr);border-radius:6px;padding:8px 10px;margin-bottom:4px">'+esc(it.detail)+'</div>';
  if (LIVE){
    body += '<label class="mlab">Cambiar fecha (due)</label>'+
      '<div class="mrow"><div><input type="date" class="minp" data-due-inp value="'+esc(it.due||'')+'"></div>'+
      '<div style="flex:0"><button class="tbtn" data-save-due>Guardar</button></div></div>';
    body += '<div class="mact">'+
      (it.status!=='done' ? '<button class="tbtn" data-drop style="color:var(--dim)">Descartar</button>'+
        (it.status==='doing'
          ? '<button class="tbtn" data-status="open">⏸ Volver a abierto</button>'
          : '<button class="tbtn" data-status="doing">▶ En curso</button>')+
        '<button class="tbtn primary" data-status="done" style="background:var(--grn);border-color:var(--grn)">✓ Marcar hecho</button>'
      : '<button class="tbtn" data-status="open">↺ Reabrir</button>')+
      '</div>';
  } else {
    body += '<div class="banner" style="margin:8px 0 0">Modo lectura — reconecta la API para actuar.</div>';
  }
  const m = modal((it.kind==='hito'?'◆ ':'')+esc(it.title), body);
  if (!LIVE) return;
  m.querySelectorAll('[data-status]').forEach(b=>b.onclick=async ()=>{
    b.disabled=true;
    try { await api('/planner/item/'+it.id, {method:'PATCH', body:JSON.stringify({status:b.dataset.status})}); m.close(); await refresh(true); }
    catch(e){ b.disabled=false; m.showErr(e.message); }
  });
  const dropBtn = m.querySelector('[data-drop]');
  if (dropBtn) dropBtn.onclick = async ()=>{
    if (!confirm('¿Descartar "'+it.title+'"? (status=dropped)')) return;
    dropBtn.disabled=true;
    try { await api('/planner/item/'+it.id, {method:'PATCH', body:JSON.stringify({status:'dropped'})}); m.close(); await refresh(true); }
    catch(e){ dropBtn.disabled=false; m.showErr(e.message); }
  };
  const saveDue = m.querySelector('[data-save-due]');
  if (saveDue) saveDue.onclick = async ()=>{
    const v = m.querySelector('[data-due-inp]').value;   // '' limpia la fecha
    saveDue.disabled=true; saveDue.textContent='…';
    try { await api('/planner/item/'+it.id, {method:'PATCH', body:JSON.stringify({due:v})}); m.close(); await refresh(true); }
    catch(e){ saveDue.disabled=false; saveDue.textContent='Guardar'; m.showErr(e.message); }
  };
}
function openCreate(prefDue){
  if (!LIVE) return;
  const inis = (STATE&&STATE.iniciativas)||[];
  const projs = new Set(); for (const it of allActive()) if (it.project) projs.add(it.project);
  const defOwner = FILTERS.owner!=='all' ? FILTERS.owner : 'jose';
  let body = '<label class="mlab">Título *</label><input class="minp" data-f="title" placeholder="Qué hay que hacer" autocomplete="off">'+
    '<div class="mrow"><div><label class="mlab">Owner *</label><select class="msel" data-f="owner">'+
      OWNERS.map(o=>'<option'+(o===defOwner?' selected':'')+'>'+o+'</option>').join('')+'</select></div>'+
    '<div><label class="mlab">Tipo</label><select class="msel" data-f="kind"><option value="todo">todo</option><option value="tarea">tarea</option><option value="hito">◆ hito</option></select></div>'+
    '<div><label class="mlab">Fecha (due)</label><input type="date" class="minp" data-f="due" value="'+esc(prefDue||'')+'"></div></div>'+
    '<div class="mrow"><div><label class="mlab">Proyecto (slug)</label><input class="minp" data-f="project" list="projlist" placeholder="opcional">'+
      '<datalist id="projlist">'+[...projs].sort().map(p=>'<option value="'+esc(p)+'">').join('')+'</datalist></div>'+
    '<div><label class="mlab">Iniciativa</label><select class="msel" data-f="parent_id"><option value="">— ninguna —</option>'+
      inis.map(i=>'<option value="'+i.id+'">'+esc(i.title)+'</option>').join('')+'</select></div></div>'+
    '<label class="mlab">Detalle</label><textarea class="mtxa" data-f="detail" placeholder="contexto opcional"></textarea>'+
    '<div class="mact"><button class="tbtn" data-close>Cancelar</button><button class="tbtn primary" data-save>Crear ítem</button></div>';
  const m = modal('＋ Nuevo ítem del planner', body);
  setTimeout(()=>m.querySelector('[data-f=title]').focus(), 50);
  m.querySelector('[data-save]').onclick = async ()=>{
    const g = f=>m.querySelector('[data-f='+f+']').value.trim();
    const data = { title:g('title'), owner:g('owner'), kind:g('kind'), source:'manual' };
    if (!data.title){ m.showErr('El título es obligatorio.'); return; }
    if (g('due')) data.due=g('due');
    if (g('project')) data.project=g('project');
    if (g('parent_id')) data.parent_id=+g('parent_id');
    if (g('detail')) data.detail=g('detail');
    const btn=m.querySelector('[data-save]'); btn.disabled=true; btn.textContent='Creando…';
    try { await api('/planner/item', {method:'POST', body:JSON.stringify(data)}); m.close(); await refresh(true); }
    catch(e){ btn.disabled=false; btn.textContent='Crear ítem'; m.showErr(e.message); }
  };
}
function openDayModal(dayIso){
  const items = itemsForDay(dayIso, pool());
  let body = items.map(e=>chipHtml(e)).join('') || '<div class="gempty">nada este día</div>';
  const m = modal('🗓 '+fmtDia(dayIso), '<div style="display:flex;flex-direction:column;gap:5px">'+body+'</div>');
  m.querySelectorAll('.ch').forEach(ch=>ch.onclick=()=>{ m.close(); openDetail(+ch.dataset.id); });
}
function openConfig(){
  const cur = apiConfig();
  let body = '<label class="mlab">Tunnel URL (https://xxxx.trycloudflare.com)</label>'+
    '<input class="minp" data-f="url" style="font-family:var(--mono)" value="'+esc(cur.url)+'" placeholder="https://…">'+
    '<label class="mlab">Bearer token</label>'+
    '<input class="minp" data-f="token" style="font-family:var(--mono)" value="'+esc(cur.token)+'" placeholder="…">'+
    '<div style="font-size:11px;color:var(--dim);margin-top:6px">Los mismos del tab Finance (se guardan solo en este navegador). La URL se auto-descubre de data/api-url.json; normalmente solo pegas el token una vez.</div>'+
    '<div class="mact"><button class="tbtn" data-clear style="color:var(--dim)">Borrar config</button>'+
    '<button class="tbtn" data-close>Cancelar</button><button class="tbtn primary" data-save>Guardar y probar</button></div>';
  const m = modal('⚙ Conexión a la API', body);
  m.querySelector('[data-save]').onclick = async ()=>{
    const url=m.querySelector('[data-f=url]').value.trim().replace(/\/+$/,''), token=m.querySelector('[data-f=token]').value.trim();
    if (!url||!token){ m.showErr('URL y token son obligatorios.'); return; }
    localStorage.setItem('finance_api_url', url); localStorage.setItem('finance_api_token', token);
    const btn=m.querySelector('[data-save]'); btn.disabled=true; btn.textContent='Probando…';
    try { await api('/health'); m.close(); await refresh(); }
    catch(e){ btn.disabled=false; btn.textContent='Guardar y probar'; m.showErr('No conecta: '+e.message); }
  };
  m.querySelector('[data-clear]').onclick = ()=>{
    localStorage.removeItem('finance_api_url'); localStorage.removeItem('finance_api_token');
    m.close(); refresh();
  };
}

/* ── wiring ────────────────────────────────────────────────────────── */
function wireContent(){
  const c = document.getElementById('content');
  c.querySelectorAll('.ch[data-id],.it[data-id]').forEach(el=>el.addEventListener('click', e=>{
    if (e.target.closest('[data-done]')) return;
    openDetail(+el.dataset.id);
  }));
  c.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click', async e=>{
    e.stopPropagation();
    b.disabled=true; b.textContent='…';
    try { await api('/planner/item/'+b.dataset.done, {method:'PATCH', body:JSON.stringify({status:'done'})}); await refresh(true); }
    catch(err){ b.disabled=false; b.textContent='✓'; alert('No se pudo cerrar: '+(err.message||err)); }
  }));
  c.querySelectorAll('.dadd').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); openCreate(b.dataset.due); }));
  c.querySelectorAll('.more').forEach(b=>b.addEventListener('click', ()=>openDayModal(b.dataset.day)));
  c.querySelectorAll('.esperabdg').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation();
    document.getElementById('espera')?.scrollIntoView({behavior:'smooth'});
  }));
  const prev=document.getElementById('cal-prev'), next=document.getElementById('cal-next'), hoy=document.getElementById('cal-hoy');
  if (prev){
    prev.onclick=()=>{ shiftCal(-1); }; next.onclick=()=>{ shiftCal(1); };
    hoy.onclick=()=>{ CAL_ANCHOR=fromIso(todayIso()); render(); };
    document.querySelectorAll('.calmode button').forEach(b=>b.onclick=()=>{
      CAL_MODE=b.dataset.m; localStorage.setItem('planner_calmode',CAL_MODE); render();
    });
  }
}
function shiftCal(dir){
  ensureAnchor();
  if (CAL_MODE==='month') CAL_ANCHOR = new Date(CAL_ANCHOR.getFullYear(), CAL_ANCHOR.getMonth()+dir, 1);
  else CAL_ANCHOR = addDays(CAL_ANCHOR, 7*dir);
  render();
}
document.getElementById('views').addEventListener('click', e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  VIEW=b.dataset.v; localStorage.setItem('planner_view',VIEW); render();
});
document.getElementById('f-project').addEventListener('change', e=>{ FILTERS.project=e.target.value; saveFilters(); render(); });
document.getElementById('f-status').addEventListener('change', e=>{ FILTERS.status=e.target.value; saveFilters(); render(); });
document.getElementById('btn-refresh').addEventListener('click', ()=>refresh());
document.getElementById('btn-cfg').addEventListener('click', openConfig);
document.getElementById('btn-new').addEventListener('click', ()=>openCreate(''));

/* ── gate de gerencia (mismo patrón/clave del tab Management) ─────── */
function gate(){
  if (sessionStorage.getItem('mgmt_auth')==='1'){ boot(); return; }
  document.getElementById('content').innerHTML = '<div class="pw-gate">'+
    '<div class="pw-icon">🗓</div>'+
    '<div class="pw-title">Planner de Gerencia — Restringido</div>'+
    '<div class="pw-sub">Escribe la clave para entrar.</div>'+
    '<input type="password" id="pw-input" placeholder="Password" autocomplete="off">'+
    '<button class="pw-btn" id="pw-btn">Entrar</button>'+
    '<div class="pw-deny" id="pw-deny">Acceso denegado</div></div>';
  const inp=document.getElementById('pw-input'),btn=document.getElementById('pw-btn'),deny=document.getElementById('pw-deny');
  function tryPw(){
    if (inp.value===MGMT_PW){ sessionStorage.setItem('mgmt_auth','1'); boot(); }
    else { inp.classList.add('pw-err'); deny.style.display='block'; setTimeout(()=>inp.classList.remove('pw-err'),400); }
  }
  btn.addEventListener('click',tryPw);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryPw(); });
  setTimeout(()=>inp.focus(),50);
}
async function boot(){
  await discoverApiUrl();
  await refresh();
}
gate();
</script>
